[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
bincode = { version = "2.0.0-rc.3" }
serde = {version = "1.0.217", features = ["serde_derive"]}
serde_json = "1.0.138"
client-sdk = { git = "https://github.com/Hyle-org/hyle.git", package="client-sdk", default-features = false, features = ["risc0", "rest"] , tag = "v0.9.0" }
hyle-sdk = { git = "https://github.com/hyle-org/hyle", package = "hyle-contract-sdk", tag = "v0.9.0" }
reqwest = "0.12.12"
hyllar = { git = "https://github.com/Hyle-org/hyle.git", package="hyllar", features = ["client"] , tag = "v0.9.0" }
hydentity = { git = "https://github.com/Hyle-org/hyle.git", package="hydentity", features = ["client"] , tag = "v0.9.0" }

methods = { path = "../contract/risczero/methods" }
methods-identity = { path = "../simple-identity/methods" }
methods-token = { path = "../simple-token/methods" }
contract-token = { path = "../simple-token/contract" }
contract-identity = { path = "../simple-identity/contract" }

lib = {path = "../contract/lib"}

risc0-zkvm = "1.2.2"
hex = "0.4.3"

